name: Build and deploy Node.js app to Azure Web App - skill-matrix-uat

on:
  push:
    branches:
      - uat
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        working-directory: frontend
        env:
         CI: "false"
         REACT_APP_API_BASE: "https://skill-matrix-api-uat-c8ajcqhhaxevbvam.northcentralus-01.azurewebsites.net"
         REACT_APP_TENANT_ID: "bfbb9a2b-6d99-4e78-b3c7-95005d555c8b"
         REACT_APP_CLIENT_ID: "f40b4118-24a7-4c0e-a5e9-1b3cad660d2e"
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'skill-matrix-uat'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_00A7023AF3A8406F81F7817E692A22AB }}
